<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>MyAcademic — SIAKAD Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#b80049',pc:'#e2165f',bg:'#f9f9ff',sl:'#f0f3ff',sc:'#e7eeff',sh:'#dee8ff',os:'#111c2d',osv:'#5b3f43',tert:'#4353b5'},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
<style>
body{font-family:Inter,sans-serif;background:#f9f9ff;color:#111c2d}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;font-weight:400;font-style:normal;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.inp{width:100%;height:40px;padding:0 12px;background:#f0f3ff;border:1px solid transparent;border-radius:8px;font-size:14px;outline:none}
.inp:focus{border-color:#e91e63;box-shadow:0 0 0 3px rgba(233,30,99,.12)}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(17,28,45,.05)}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;background:#b80049;color:#fff;box-shadow:0 4px 12px rgba(233,30,99,.25)}
.btn:hover{background:#e2165f}.btn2{background:#dee8ff;color:#b80049;box-shadow:none}.btn2:hover{background:#d0dcf8}
.th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5b3f43;text-align:left;padding:14px 16px;background:#f0f3ff}
.td{padding:12px 16px;font-size:14px}tr.r{border-top:1px solid rgba(17,28,45,.05)}tr.r:hover{background:#fdf5f8}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5b3f43;margin:12px 0 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:8px;color:#5b3f43;font-size:14px;cursor:pointer}
.nav:hover{background:#dee8ff}.nav.on{background:#e2165f;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(233,30,99,.2)}
.pg{min-width:32px;height:32px;border-radius:8px;font-size:13px;font-weight:600}.pg.on{background:#b80049;color:#fff}
#side.col{width:5rem}#side.col .lb{display:none}#main.col{padding-left:5rem}#top.col{left:5rem}
.mask{position:fixed;inset:0;background:rgba(38,49,67,.45);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
@media(max-width:900px){#side{width:5rem}#side .lb{display:none}#main{padding-left:5rem}#top{left:5rem}}
@media print{#side,#top,.noprint{display:none!important}#main{padding:0!important}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80]"></div>
<script>
const $=s=>document.querySelector(s);
const CLS=['XI IPA 1','XI IPA 2','XI IPS 1'],SUB=['Mathematics','Physics','English','Biology','Chemistry','Sociology'];
const YRS=['2026/2027','2025/2026','2024/2025'],SEM=['Ganjil (Odd)','Genap (Even)'];
const TCH=['Budi Santoso, S.Pd','Citra Dewi, M.Si','Andi Pratama, M.Pd','Sri Wahyuni, M.Pd','Fauzi, S.Si','Rahmat Hidayat, M.Kom'];
const NIP={0:'19840312 200801 1 004',1:'19890724 201402 2 009',2:'19910515 201803 1 002',3:'19781109 200212 2 001',4:'19860408 201101 1 007',5:'19800101 200501 1 003'};
const IC={Mathematics:'calculate',Physics:'bolt',English:'translate',Biology:'biotech',Chemistry:'science',Sociology:'groups'};
let S=[['Andi Pratama',0,'Male'],['Budi Santoso',0,'Male'],['Citra Dewi',1,'Female'],['Dian Anugrah',1,'Male'],['Eko Prasetyo',2,'Male'],['Fani Rahmawati',2,'Female']];
const fn=['Gita','Hadi','Indra','Joko','Kiki','Lina','Maya','Nanda','Oka','Putri','Rian','Sari'],ln=['Wijaya','Putra','Lestari','Saputra','Utami','Hakim'];
for(let i=6;i<42;i++)S.push([fn[i%12]+' '+ln[i%6],i%3,i%2?'Female':'Male']);
S=S.map((s,i)=>({nis:String(10001+i),name:s[0],cls:CLS[s[1]],g:s[2],st:'Active',avg:i<6?[85.2,78.5,91,86.4,73.8,88][i]:+(72+((i*7)%22)+.4).toFixed(1)}));
let M=[['MAT','Mathematics'],['PHY','Physics'],['ENG','English'],['BIO','Biology'],['CHE','Chemistry'],['HIST','History'],['SOC','Sociology'],['IND','Bahasa Indonesia']].map(m=>({code:m[0],name:m[1],type:'Subject',cat:'Science / MIPA',st:'Active',up:'Today'}));
let TA=[[0,0,0],[1,0,1],[2,1,2],[3,0,3],[4,1,4]].map((a,i)=>({id:i,t:TCH[a[0]],c:CLS[a[1]],s:SUB[a[2]],y:'2024/2025',sem:SEM[0]}));
let GR=[[0,0,0,'Complete'],[1,0,1,'In Progress'],[2,1,2,'Complete'],[3,0,3,'Not Started'],[4,1,4,'In Progress'],[5,2,5,'Complete']].map((a,i)=>({id:i,t:TCH[a[0]],c:CLS[a[1]],s:SUB[a[2]],st:a[3],y:'2026/2027',sem:SEM[0]}));
let SC={};const st={page:'login',pg:{},q:{},f:{},sel:null,collapsed:false};
const pred=v=>v>=90?['A','Tuntas']:v>=80?['A','Tuntas']:v>=75?['B','Tuntas']:['C','Remedial'];
const letter=v=>v>=82?'A':v>=75?'B':v>=65?'C':'D';
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const av=(n,i=0)=>`<span class="inline-flex w-8 h-8 rounded-full items-center justify-center text-xs font-bold shrink-0 ${['bg-pink-100 text-primary','bg-sh text-tert','bg-orange-100 text-orange-700'][i%3]}">${ini(n)}</span>`;
const sel=(id,opts,v='')=>`<select id="${id}" class="inp">${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
const chip=(t,k)=>`<span class="chip ${{g:'bg-emerald-100 text-emerald-700',a:'bg-amber-100 text-amber-700',b:'bg-sh text-tert',p:'bg-pink-100 text-primary',n:'bg-slate-200 text-slate-600'}[k]}">${t}</span>`;
function toast(m){const t=$('#toast');t.innerHTML=`<div class="bg-[#263143] text-white text-sm px-4 py-2.5 rounded-lg shadow-xl">${m}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2400)}
function go(p,sel){st.page=p;st.sel=sel||null;render();scrollTo(0,0)}
function pager(total,per,key){const n=Math.max(1,Math.ceil(total/per)),c=Math.min(st.pg[key]||1,n);st.pg[key]=c;
 let b=[...Array(n).keys()].map(i=>i+1).filter(i=>n<6||i<4||i==n||Math.abs(i-c)<1);let h='';let prev=0;
 for(const i of b){if(i-prev>1)h+='<span class="px-1 text-slate-400">…</span>';h+=`<button class="pg ${i==c?'on':''}" onclick="st.pg['${key}']=${i};render()">${i}</button>`;prev=i}
 return{c,html:`<div class="flex items-center justify-between px-4 py-3 bg-sl text-xs text-osv"><span>Showing ${total?(c-1)*per+1:0} to ${Math.min(c*per,total)} of ${total}</span><div class="flex items-center gap-1"><button class="pg" onclick="st.pg['${key}']=Math.max(1,${c-1});render()"><span class="ms">chevron_left</span></button>${h}<button class="pg" onclick="st.pg['${key}']=Math.min(${n},${c+1});render()"><span class="ms">chevron_right</span></button></div></div>`}}
function head(t,sub,act=''){return`<div class="flex items-start justify-between gap-4 mb-5 flex-wrap"><div><h1 class="text-3xl font-semibold tracking-tight">${t}</h1><p class="text-sm text-osv mt-1">${sub}</p></div><div class="flex gap-2 noprint">${act}</div></div>`}
function filterBar(key,defs,search){const f=st.f[key]=st.f[key]||{};return`<div class="card p-4 mb-5 flex gap-3 flex-wrap items-center">${search?`<div class="flex items-center gap-2 bg-sl rounded-lg px-3 h-10 flex-1 min-w-[200px]"><span class="ms text-osv">search</span><input class="bg-transparent outline-none text-sm w-full" placeholder="${search}" value="${st.q[key]||''}" oninput="st.q['${key}']=this.value;st.pg['${key}']=1;render(1)"></div>`:''}
 ${defs.map(([k,l,o,d])=>`<select class="inp !w-auto min-w-[130px]" title="${l}" onchange="st.f['${key}']['${k}']=this.value;st.pg['${key}']=1;render()">${o.map(x=>`<option ${(f[k]??d)==x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}</div>`}
const fv=(key,k,d)=>(st.f[key]||{})[k]??d;
function modal(title,sub,body,ok,onok,w='max-w-md'){$('#modal').innerHTML=`<div class="mask" onclick="if(event.target==this)closeM()"><div class="bg-white rounded-2xl shadow-2xl w-full ${w} max-h-[92vh] overflow-auto"><div class="p-6 pb-2 flex justify-between items-start"><div><h2 class="text-2xl font-semibold tracking-tight">${title}</h2><p class="text-sm text-osv">${sub}</p></div><button onclick="closeM()" class="p-1 rounded-lg hover:bg-sc"><span class="ms">close</span></button></div><div class="px-6 pb-2">${body}</div><div class="p-5 flex justify-end gap-2 bg-bg"><button class="px-4 h-10 font-semibold rounded-lg hover:bg-sc" onclick="closeM()">Cancel</button><button class="btn" onclick="${onok}"><span class="ms">check</span>${ok}</button></div></div></div>`}
const closeM=()=>$('#modal').innerHTML='';
const note=t=>`<div class="mt-4 flex gap-2 text-xs text-tert bg-sc rounded-lg p-3"><span class="ms !text-base">info</span><span>${t}</span></div>`;
const v=id=>document.getElementById(id).value;
function confirmDel(msg,fn){modal('Delete?',msg,'',  'Delete',fn+';closeM()','max-w-sm')}

/* ---------- pages ---------- */
function login(){return`<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden"><div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-100/60 rounded-full blur-3xl"></div><div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sh/70 rounded-full blur-3xl"></div>
<form class="relative w-full max-w-[420px] bg-white/80 backdrop-blur rounded-xl shadow-xl p-10 flex flex-col items-center" onsubmit="event.preventDefault();if(!v('u')||!v('p')){toast('Enter username and password');return}go('dashboard')">${logo(56)}<h1 class="text-xl font-semibold mt-3">MyAcademic</h1><p class="text-xs text-osv mb-8">Sistem Informasi Akademik</p>
<label class="lbl !normal-case !text-xs w-full">Username / Email</label><input id="u" class="inp" placeholder="Username / Email" value="admin@sman1harapan.sch.id">
<label class="lbl !normal-case !text-xs w-full">Password</label><div class="relative w-full"><input id="p" type="password" class="inp pr-10" placeholder="Password" value="demo1234"><button type="button" class="absolute right-3 top-2 text-osv" onclick="p.type=p.type=='password'?'text':'password'"><span class="ms">visibility</span></button></div>
<button class="btn w-full justify-center mt-6 uppercase tracking-wide">Login</button></form></div>`}
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" stroke="#e91e63" stroke-width="3"><path d="M24 6l-16 6 16 6 16-6z" fill="#e91e63"/><path d="M10 22v14c5-1 10 0 14 3 4-3 9-4 14-3V22M24 21v18"/></svg>`;
const NAV=[['dashboard','Dashboard','dashboard'],['h','Academic'],['students','Students','school'],['master','Academic Master','database'],['teaching','Teaching Assignment','co_present'],['grades','Grade Management','assignment_turned_in'],['results','Academic Result','analytics'],['h','Account'],['profile','Profile','account_circle'],['login','Logout','logout']];
function shell(body){const act=st.page=='result'?'results':st.page;const c=st.collapsed?'col':'';
return`<aside id="side" class="${c} fixed left-0 top-0 h-screen w-64 bg-white/80 backdrop-blur-xl z-50 py-4 px-2 shadow-sm transition-all"><div class="h-14 px-3 flex items-center justify-between">${st.collapsed?'':`<div class="flex items-center gap-2">${logo(30)}<b class="lb text-lg">MyAcademic</b></div>`}<button class="p-1 rounded-lg hover:bg-sc" onclick="st.collapsed=!st.collapsed;render()"><span class="ms">menu_open</span></button></div>
<nav class="flex flex-col gap-1 mt-2">${NAV.map(n=>n[0]=='h'?`<div class="lb px-4 pt-4 pb-1 text-[11px] font-semibold uppercase tracking-wider text-osv/70">${n[1]}</div>`:`<a class="nav ${act==n[0]?'on':''} ${st.collapsed?'justify-center':''}" title="${n[1]}" onclick="go('${n[0]}')"><span class="ms">${n[2]}</span><span class="lb">${n[1]}</span></a>`).join('')}</nav></aside>
<div id="main" class="${c} pl-64 transition-all"><header id="top" class="${c} fixed top-0 left-64 right-0 h-16 bg-white/80 backdrop-blur-xl z-40 flex items-center justify-between px-6 shadow-sm"><div class="flex items-center gap-2 bg-sl rounded-lg px-3 h-9 w-80 max-w-[50%]"><span class="ms text-osv">search</span><input class="bg-transparent outline-none text-sm w-full" placeholder="Cari data..." onkeydown="if(event.key=='Enter'){st.q.students=this.value;st.pg.students=1;go('students')}"></div>
<div class="flex items-center gap-4"><button class="relative" onclick="toast('3 new notifications')"><span class="ms text-osv">notifications</span><i class="absolute top-0 right-0 w-2 h-2 rounded-full bg-primary"></i></button><div class="flex items-center gap-2 cursor-pointer" onclick="go('profile')">${av('Sarah Jenkins')}<div class="leading-tight hidden sm:block"><div class="text-sm font-semibold">Sarah Jenkins</div><div class="text-[11px] font-semibold text-osv">Administrator</div></div></div></div></header>
<main class="pt-24 px-6 pb-10 max-w-[1440px] mx-auto min-h-screen">${body}</main></div>`}
function dashboard(){const stat=(l,v,i)=>`<div class="card p-6 flex flex-col gap-4"><div class="flex justify-between items-center"><span class="text-xs font-medium uppercase tracking-wider text-osv">${l}</span><span class="w-10 h-10 rounded-lg bg-sl flex items-center justify-center text-primary"><span class="ms">${i}</span></span></div><span class="text-4xl font-semibold tracking-tight num">${v}</span></div>`;
const act=[['assignment_turned_in','Grade submitted — Mathematics — XI IPA 1'],['person_add','New student registered — '+S[S.length-1].name.split(' ')[0]],['edit_calendar','Teaching assignment updated']];
return head('Dashboard','Overview akademik sekolah')+`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">${stat('Students','1,245','group')+stat('Teachers','86','person_apron')+stat('Classes','42','meeting_room')+stat('Academic Year','2026/2027','calendar_today')}</div>
<div class="grid md:grid-cols-2 gap-6 mt-6"><div class="card p-6"><div class="text-xs font-medium uppercase tracking-wider text-osv">Academic Overview</div><p class="mt-2 text-sm text-osv">Current Semester: <b class="text-xl text-os ml-1">Ganjil</b></p></div><div class="card p-6"><div class="text-xs font-medium uppercase tracking-wider text-osv">Active Academic Period</div><b class="block mt-2 text-xl">2026/2027 Ganjil</b></div></div>
<div class="card mt-6 overflow-hidden"><h2 class="p-6 font-semibold">Recent Activity</h2>${act.map((a,i)=>`<div class="flex items-center gap-4 px-6 py-3 ${i%2?'bg-sl/40':''} hover:bg-sl"><span class="w-9 h-9 rounded-lg bg-sc text-primary flex items-center justify-center"><span class="ms">${a[0]}</span></span><span class="text-sm">${a[1]}</span></div>`).join('')}</div>`}
function students(){const q=(st.q.students||'').toLowerCase(),fc=fv('students','c','Class'),fs=fv('students','s','Status');
const L=S.filter(s=>(!q||s.name.toLowerCase().includes(q)||s.nis.includes(q))&&(fc=='Class'||s.cls==fc)&&(fs=='Status'||s.st==fs)),P=pager(L.length,6,'students');
return head('Students','Manage student information',`<button class="btn" onclick="studentForm()"><span class="ms">add</span>Add Student</button>`)+filterBar('students',[['c','Class',['Class',...CLS],'Class'],['s','Status',['Status','Active','Inactive'],'Status']],'Search student...')+
`<div class="card overflow-hidden"><table class="w-full"><thead><tr>${['NIS','Student Name','Class','Gender','Status'].map(h=>`<th class="th">${h}</th>`).join('')}<th class="th text-right">Action</th></tr></thead><tbody>${L.slice((P.c-1)*6,P.c*6).map(s=>`<tr class="r"><td class="td mono">${s.nis}</td><td class="td font-medium">${s.name}</td><td class="td text-osv">${s.cls}</td><td class="td text-osv">${s.g}</td><td class="td">${chip(s.st,s.st=='Active'?'b':'n')}</td><td class="td text-right whitespace-nowrap"><button class="p-1 rounded hover:bg-sc" title="Edit" onclick="studentForm('${s.nis}')"><span class="ms">edit</span></button><button class="p-1 rounded hover:bg-sc" title="Delete" onclick="confirmDel('Remove ${s.name} permanently?','delStudent(\\'${s.nis}\\')')"><span class="ms">delete</span></button></td></tr>`).join('')||'<tr><td colspan=6 class="td text-center text-osv py-10">No students found</td></tr>'}</tbody></table>${P.html}</div>`}
function studentForm(nis){const e=S.find(s=>s.nis==nis),n=String(10001+S.length);
modal(e?'Edit Student':'Add Student',e?'Update academic records and student credentials':'Enter official student credentials',
`<label class="lbl">NIS${e?' (Student ID Number)':''}</label><div class="inp flex items-center justify-between mono !bg-sc">${e?e.nis:n}${e?'<span class="chip bg-sh text-tert">Read-only / Unique</span>':''}</div><label class="lbl">Student Name</label><input id="fn" class="inp" placeholder="Enter full student name" value="${e?e.name:''}"><div class="grid grid-cols-2 gap-3"><div><label class="lbl">Class ${e?'Cohort':'Group'}</label>${sel('fc',['Select class',...CLS],e?.cls)}</div><div><label class="lbl">Gender</label>${sel('fg',['Select gender','Male','Female'],e?.g)}</div></div><label class="lbl">${e?'Academic ':''}Status</label>${sel('fs',['Active','Inactive'],e?.st)}`+(e?note('Changes will immediately reflect across teaching assignments and grade reports.'):''),e?'Update Student':'Save Student',`saveStudent('${nis||''}')`)}
function saveStudent(nis){const n=v('fn').trim();if(!n||v('fc')=='Select class'||v('fg')=='Select gender'){toast('Please complete all fields');return}
if(nis){Object.assign(S.find(s=>s.nis==nis),{name:n,cls:v('fc'),g:v('fg'),st:v('fs')});toast('Student updated')}else{S.push({nis:String(10001+S.length),name:n,cls:v('fc'),g:v('fg'),st:v('fs'),avg:+(75+Math.random()*15).toFixed(1)});toast('Student added')}closeM();render()}
const delStudent=n=>{S=S.filter(s=>s.nis!=n);toast('Student deleted');render()};
function master(){const P=pager(M.length,6,'master');
return head('Academic Master','Manage core academic master data',`<button class="btn" onclick="masterForm()"><span class="ms">add</span>Add New</button>`)+`<div class="card overflow-hidden"><table class="w-full"><thead><tr>${['Code','Name','Status','Updated'].map(h=>`<th class="th">${h}</th>`).join('')}<th class="th text-right">Action</th></tr></thead><tbody>${M.slice((P.c-1)*6,P.c*6).map((m,i)=>`<tr class="r"><td class="td mono font-semibold text-primary">${m.code}</td><td class="td font-semibold">${m.name}</td><td class="td">${chip(m.st,m.st=='Active'?'b':'n')}</td><td class="td text-xs text-osv">${m.up}</td><td class="td text-right"><button class="text-primary text-sm font-semibold inline-flex items-center gap-1" onclick="masterForm('${m.code}')"><span class="ms !text-base">edit</span>Edit</button></td></tr>`).join('')}</tbody></table>${P.html}</div>`}
function masterForm(code){const e=M.find(m=>m.code==code),t=e?.type||'Subject';
modal(e?`Edit ${t} Master`:'Add Academic Master',e?'Update academic subject details and classifications':'Create new subject or curriculum entry',
`<label class="lbl">Master Type</label>${e?`<div class="inp flex items-center !bg-sc">${t} (Core Curriculum)</div>`:sel('mt',['Subject','Teacher','Class','Academic Year'])}<div class="grid grid-cols-2 gap-3"><div><label class="lbl">Subject Code</label><input id="mc" class="inp mono" placeholder="E.G. MAT-01" value="${e?.code||''}"></div><div><label class="lbl">Status</label>${sel('ms',['Active','Inactive'],e?.st)}</div></div><label class="lbl">Subject Name</label><input id="mn" class="inp" placeholder="Enter subject name (e.g. Chemistry)" value="${e?.name||''}"><label class="lbl">Category / Department</label>${sel('mg',['Science / MIPA','Social / IPS','Language & Culture','General Compulsory'],e?.cat)}`+note(e?'Modifying subject master properties will recalculate teacher syllabus allocations across current active rosters.':'This master data entry will immediately synchronize across curriculum planners and teaching assignment allocations.'),e?'Update Subject':'Save Master',`saveMaster('${code||''}')`)}
function saveMaster(code){const c=v('mc').trim().toUpperCase(),n=v('mn').trim();if(!c||!n){toast('Code and name are required');return}
if(code){Object.assign(M.find(m=>m.code==code),{code:c,name:n,st:v('ms'),cat:v('mg'),up:'Today'});toast('Master data updated')}else{if(M.some(m=>m.code==c)){toast('Code already exists');return}M.unshift({code:c,name:n,type:v('mt'),st:v('ms'),cat:v('mg'),up:'Today'});toast('Master data added')}closeM();render()}
function teaching(){const y=fv('teaching','y','2024/2025'),sm=fv('teaching','m','Ganjil (Odd)'),c=fv('teaching','c','All Classes'),t=fv('teaching','t','All Teachers');
const L=TA.filter(a=>a.y==y&&(sm=='All Semesters'||a.sem==sm)&&(c=='All Classes'||a.c==c)&&(t=='All Teachers'||a.t==t));
